<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- 홈 화면에 더할 때 보이는 이름(안드로이드 앱 런처 이름 strings.xml app_name과 같음) -->
  <meta name="application-name" content="SafePause">
  <meta name="apple-mobile-web-app-title" content="SafePause">
  <title>SafePause</title>
  <link rel="icon" href="icons/stop.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/txns.css">
  <link rel="stylesheet" href="css/views/notify.css">
  <link rel="stylesheet" href="css/views/more.css">
  <script type="module" src="js/main.js"></script>
</head>
<!-- spellcheck="false": 브라우저의 온라인 맞춤법 검사가 받는 사람·계좌번호 글을 밖으로 보내지 않게(S35) -->
<body spellcheck="false">
  <a class="skip-link" href="#main" data-skip="1">본문으로 바로 가기</a>

  <div id="app" class="app">
    <nav id="nav" class="bottom-nav" aria-label="주요 화면"></nav>
    <div class="shell">
      <header id="appbar" class="appbar"></header>
      <div id="engine-slot"></div>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
    <div id="sheet-root"></div>
  </div>

  <div id="toast-root" class="toast-root"></div>
  <div id="announcer" class="sr-only" aria-live="assertive"></div>
  <noscript><p class="noscript">이 화면은 자바스크립트가 켜져 있어야 해요.</p></noscript>
</body>
</html>
